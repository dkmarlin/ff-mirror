name: mirror-ff-calendar
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sS -f --retry 2 --retry-delay 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -o ff_calendar_thisweek.json \
            https://nfs.faireconomy.media/ff_calendar_thisweek.json
          head -c 1 ff_calendar_thisweek.json | grep -q '\[' || { echo "not json, aborting"; exit 1; }
      - name: commit
        run: |
          git config user.name "flonk-bot"
          git config user.email "flonk-bot@users.noreply.github.com"
          git add ff_calendar_thisweek.json
          git diff --staged --quiet || git commit -m "chore: mirror ff calendar"
          git push
